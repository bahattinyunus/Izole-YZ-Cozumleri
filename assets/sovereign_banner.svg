<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.05)" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Outer Border Neon Glow -->
  <rect x="2" y="2" width="1196" height="356" rx="14" fill="none" stroke="url(#shield-grad)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Cyber Grid Circuit Lines -->
  <path d="M 50 180 L 140 180 L 180 220 L 320 220" fill="none" stroke="rgba(0, 242, 254, 0.2)" stroke-width="2" />
  <circle cx="320" cy="220" r="4" fill="#00f2fe" filter="url(#glow)" />
  <path d="M 880 140 L 1020 140 L 1060 180 L 1150 180" fill="none" stroke="rgba(56, 239, 125, 0.2)" stroke-width="2" />
  <circle cx="880" cy="140" r="4" fill="#38ef7d" filter="url(#glow)" />

  <!-- Iconic Central Shield Icon -->
  <g transform="translate(100, 75)">
    <!-- Glow aura -->
    <path d="M 100 20 L 180 50 L 180 130 C 180 185 100 220 100 220 C 100 220 20 185 20 130 L 20 50 Z" 
          fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glow)" opacity="0.6" />
    <!-- Main Shield Frame -->
    <path d="M 100 25 L 175 53 L 175 128 C 175 178 100 210 100 210 C 100 210 25 178 25 128 L 25 53 Z" 
          fill="rgba(10, 25, 45, 0.7)" stroke="url(#shield-grad)" stroke-width="3" />
    <!-- AI Core Neural Node inside Shield -->
    <circle cx="100" cy="115" r="22" fill="none" stroke="url(#accent-cyan)" stroke-width="3" />
    <circle cx="100" cy="115" r="10" fill="#00f2fe" filter="url(#glow)" />
    <!-- Air-Gap Broken Circuit Lines (Symbolizing Complete Air-Gap Isolation) -->
    <path d="M 60 85 L 85 105" stroke="#38ef7d" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 140 85 L 115 105" stroke="#38ef7d" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 100 145 L 100 175" stroke="#38ef7d" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="60" cy="85" r="3" fill="#38ef7d" />
    <circle cx="140" cy="85" r="3" fill="#38ef7d" />
    <circle cx="100" cy="175" r="3" fill="#38ef7d" />
  </g>

  <!-- Typography & Text Content -->
  <g transform="translate(340, 0)">
    <!-- Badge Pill -->
    <g transform="translate(0, 55)">
      <rect width="360" height="28" rx="14" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
      <text x="180" y="18" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">DEFENSE-GRADE AIR-GAPPED AI SUITE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      SOVEREIGN <tspan fill="url(#shield-grad)">AI</tspan> GATEWAY
    </text>

    <!-- Subtitle (Turkish & English) -->
    <text x="0" y="172" fill="#a0aec0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
      İzole Yapay Zeka Çözümleri: Yerel LLM, DLP &amp; Sıfır Güvenlik Mimarisi
    </text>

    <!-- Feature Pillars Tags -->
    <g transform="translate(0, 215)">
      <!-- Tag 1: Air-Gapped -->
      <rect x="0" y="0" width="160" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="80" y="21" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">⚡ AIR-GAPPED CORE</text>

      <!-- Tag 2: Prompt Guard -->
      <rect x="175" y="0" width="165" height="34" rx="8" fill="rgba(0, 242, 254, 0.08)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1" />
      <text x="257" y="21" fill="#00f2fe" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">🛡️ PROMPT GUARD</text>

      <!-- Tag 3: Hardware Independent -->
      <rect x="355" y="0" width="180" height="34" rx="8" fill="rgba(56, 239, 125, 0.08)" stroke="rgba(56, 239, 125, 0.3)" stroke-width="1" />
      <text x="445" y="21" fill="#38ef7d" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">🦅 SOVEREIGN HARDWARE</text>

      <!-- Tag 4: KVKK / GDPR -->
      <rect x="550" y="0" width="170" height="34" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="635" y="21" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">⚖️ KVKK / EU AI ACT</text>
    </g>

    <!-- Bottom Terminal Command Highlight -->
    <g transform="translate(0, 275)">
      <rect width="520" height="34" rx="6" fill="#030712" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="15" y="22" fill="#38ef7d" font-family="monospace" font-size="13" font-weight="bold">$</text>
      <text x="35" y="22" fill="#cbd5e1" font-family="monospace" font-size="13">python sovereign_ctl.py status</text>
      <text x="420" y="22" fill="#64748b" font-family="monospace" font-size="11">[Zero External Deps]</text>
    </g>
  </g>
</svg>
